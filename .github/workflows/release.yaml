name: Auto-Tag and Release on Version Bump

on:
  push:
    branches:
      - main  # Change if your default branch is different (e.g., master)
    paths:
      - 'g32-display.yaml'

jobs:
  tag-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write  # Required for tagging, pushing, and creating releases

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}  # Ensures we are on the branch (not detached HEAD)
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0  # Full history for safety

      - name: Install yq
        run: |
          wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O yq
          chmod +x yq
          sudo mv yq /usr/local/bin/yq

      - name: Extract and clean version from YAML
        id: extract_version
        run: |
          RAW=$(yq e '.substitutions.version' g32-display.yaml)
          echo "Raw yq output: '$RAW'"

          # Remove surrounding quotes if present
          STRIPPED="${RAW%\"}"
          STRIPPED="${STRIPPED#\"}"

          # Trim leading/trailing whitespace only
          TRIMMED=$(echo "$STRIPPED" | xargs echo -n)
          echo "Trimmed display version (spaces preserved): '$TRIMMED'"

          # Remove ALL spaces completely for safe tag/asset names
          CLEAN_TAG=$(echo "$TRIMMED" | tr -d ' ')
          echo "Clean tag name (spaces removed): '$CLEAN_TAG'"

          echo "VERSION=$TRIMMED" >> $GITHUB_ENV
          echo "TAG_NAME=$CLEAN_TAG" >> $GITHUB_ENV

      - name: Get last commit message
        id: commit_message
        run: |
          MESSAGE=$(git log -1 --pretty=%B | tail -n +3)
          echo "MESSAGE<<EOF" >> $GITHUB_ENV
          echo "$MESSAGE" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Check if tag already exists on remote
        id: check_tag
        run: |
          if git ls-remote --tags origin "${{ env.TAG_NAME }}" | grep -q "refs/tags/${{ env.TAG_NAME }}$"; then
            echo "Tag ${{ env.TAG_NAME }} already exists. Skipping tag creation and release."
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "Tag ${{ env.TAG_NAME }} does not exist. Will create it."
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Prepare release YAML with replacements
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          # YAML artifacts are source configs (no espbinpatcher placeholders).
          # Create them from the committed file before CI rewrites substitutions.
          cp g32-display.yaml g32-display-variant.yaml

          # 1. Uncomment speaker lines
          sed -i '/variant[[:space:]]*\[speaker\]/ s/^\([[:space:]]*\)# \(.*\)$/\1\2/' "g32-display-variant.yaml"
          # 2. Comment buzzer lines
          sed -i '/variant[[:space:]]*\[buzzer\]/ s/^\([[:space:]]*\)\([^[:space:]#]\)/\1# \2/' "g32-display-variant.yaml"
          mv g32-display-variant.yaml g32-display-with-speaker.yaml

          cp g32-display.yaml g32-display-with-buzzer.yaml

      - name: Set up Python
        if: steps.check_tag.outputs.exists == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache PlatformIO
        if: steps.check_tag.outputs.exists == 'false'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: esphome-${{ runner.os }}-platformio
          restore-keys: |
            esphome-${{ runner.os }}-platformio

      - name: Install ESPHome
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          MIN_VERSION=$(yq e '.esphome.min_version' g32-display.yaml)
          MIN_VERSION="${MIN_VERSION%\"}"
          MIN_VERSION="${MIN_VERSION#\"}"
          echo "Installing esphome==${MIN_VERSION}"
          python -m pip install --upgrade pip
          python -m pip install "esphome==${MIN_VERSION}"
          esphome version

      - name: Write placeholder secrets.yaml for compile
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          # secrets.yaml is gitignored. Release binaries get unique padded
          # needles so espbinpatcher can replace them in-place later.
          # api.encryption.key must be base64 of exactly 32 bytes; the raw
          # 32-byte needle in the .bin is ESPBINPATCH_API_ENCRYPTION_KEY__
          python3 << 'PY'
          import base64
          from pathlib import Path

          wifi_ssid = "ESPBINPATCH_WIFI_SSID___________"
          wifi_password = "ESPBINPATCH_WIFI_PASSWORD______________________________________"
          ota_password = "ESPBINPATCH_OTA_PASSWORD________________________________________"
          api_raw = "ESPBINPATCH_API_ENCRYPTION_KEY__"
          if not (len(wifi_ssid) == 32 and len(wifi_password) == 63 and len(ota_password) == 64 and len(api_raw) == 32):
              raise SystemExit("placeholder length mismatch")
          api_b64 = base64.b64encode(api_raw.encode("ascii")).decode("ascii")
          Path("secrets.yaml").write_text(
              f'wifi_ssid: "{wifi_ssid}"\n'
              f'wifi_password: "{wifi_password}"\n'
              f'ota_password: "{ota_password}"\n'
              f'api_encryption_key: "{api_b64}"\n'
          )
          print(f"api raw needle ({len(api_raw)} bytes): {api_raw}")
          print(f"api_encryption_key (base64): {api_b64}")
          PY

      - name: Inject espbinpatcher placeholders into YAML (checkout only)
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          # Committed g32-display.yaml is not changed. This rewrite exists
          # only for esphome compile in this job, then is discarded.
          python3 << 'PY'
          from pathlib import Path
          import re
          path = Path("g32-display.yaml")
          text = path.read_text()
          replacements = {
              "wifi_ssid": "!secret wifi_ssid",
              "wifi_password": "!secret wifi_password",
              "api_encryption_key": "!secret api_encryption_key",
              "ota_password": "!secret ota_password",
          }
          for key, value in replacements.items():
              pattern = rf"^  {key}:.*$"
              text, n = re.subn(pattern, f"  {key}: {value}", text, count=1, flags=re.M)
              if n != 1:
                  raise SystemExit(f"expected 1 line for {key}, got {n}")
          path.write_text(text)
          PY
          echo "Substitutions after rewrite:"
          grep -E '^  (wifi_ssid|wifi_password|api_encryption_key|ota_password):' g32-display.yaml

      - name: Compile buzzer firmware
        if: steps.check_tag.outputs.exists == 'false'
        run: esphome compile g32-display.yaml

      - name: Collect buzzer firmware binaries
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          set -euo pipefail
          DEVICE_NAME=$(yq e '.substitutions.name' g32-display.yaml)
          DEVICE_NAME="${DEVICE_NAME%\"}"
          DEVICE_NAME="${DEVICE_NAME#\"}"
          BUILD_DIR="/tmp/esphome_build/${DEVICE_NAME}"
          PIOENV="${BUILD_DIR}/.pioenvs/${DEVICE_NAME}"
          IDF_BUILD="${BUILD_DIR}/build"
          OUT_DIR="firmware"
          PREFIX="${OUT_DIR}/g32-display-${TAG_NAME}-buzzer"

          mkdir -p "${OUT_DIR}"

          echo "Build tree:"
          find "${BUILD_DIR}" -type f \( -name '*.bin' -o -name '*.elf' \) -print | sort || true

          copy_bin() {
            local src="$1"
            local dest="$2"
            if [ -f "${src}" ]; then
              cp "${src}" "${dest}"
              echo "Copied ${src} -> ${dest}"
              return 0
            fi
            return 1
          }

          if ! copy_bin "${PIOENV}/firmware.factory.bin" "${PREFIX}.factory.bin.espbinpatch" \
            && ! copy_bin "${IDF_BUILD}/${DEVICE_NAME}.factory.bin" "${PREFIX}.factory.bin.espbinpatch" \
            && ! copy_bin "${IDF_BUILD}/firmware.factory.bin" "${PREFIX}.factory.bin.espbinpatch"; then
            echo "No factory firmware binary found under ${BUILD_DIR}"
            exit 1
          fi

          if ! copy_bin "${PIOENV}/firmware.ota.bin" "${PREFIX}.ota.bin.espbinpatch" \
            && ! copy_bin "${IDF_BUILD}/${DEVICE_NAME}.ota.bin" "${PREFIX}.ota.bin.espbinpatch" \
            && ! copy_bin "${PIOENV}/firmware.bin" "${PREFIX}.ota.bin.espbinpatch" \
            && ! copy_bin "${IDF_BUILD}/${DEVICE_NAME}.bin" "${PREFIX}.ota.bin.espbinpatch"; then
            echo "No OTA firmware binary found under ${BUILD_DIR}"
            exit 1
          fi

          python3 -c '
          import sys
          from pathlib import Path
          needles = [
              b"ESPBINPATCH_WIFI_SSID___________",
              b"ESPBINPATCH_WIFI_PASSWORD______________________________________",
              b"ESPBINPATCH_OTA_PASSWORD________________________________________",
              b"ESPBINPATCH_API_ENCRYPTION_KEY__",
          ]
          for path in sys.argv[1:]:
              data = Path(path).read_bytes()
              missing = [n.decode() for n in needles if n not in data]
              if missing:
                  raise SystemExit(f"{path} missing placeholders: {missing}")
              print(f"placeholders ok: {path}")
          ' "${PREFIX}.factory.bin.espbinpatch" "${PREFIX}.ota.bin.espbinpatch"

          ls -lh "${OUT_DIR}"

      - name: Compile speaker firmware
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          cp g32-display.yaml g32-display-compile-speaker.yaml
          sed -i '/variant[[:space:]]*\[speaker\]/ s/^\([[:space:]]*\)# \(.*\)$/\1\2/' g32-display-compile-speaker.yaml
          sed -i '/variant[[:space:]]*\[buzzer\]/ s/^\([[:space:]]*\)\([^[:space:]#]\)/\1# \2/' g32-display-compile-speaker.yaml
          esphome compile g32-display-compile-speaker.yaml

      - name: Collect speaker firmware binaries
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          set -euo pipefail
          DEVICE_NAME=$(yq e '.substitutions.name' g32-display.yaml)
          DEVICE_NAME="${DEVICE_NAME%\"}"
          DEVICE_NAME="${DEVICE_NAME#\"}"
          BUILD_DIR="/tmp/esphome_build/${DEVICE_NAME}"
          PIOENV="${BUILD_DIR}/.pioenvs/${DEVICE_NAME}"
          IDF_BUILD="${BUILD_DIR}/build"
          OUT_DIR="firmware"
          PREFIX="${OUT_DIR}/g32-display-${TAG_NAME}-speaker"

          mkdir -p "${OUT_DIR}"

          echo "Build tree:"
          find "${BUILD_DIR}" -type f \( -name '*.bin' -o -name '*.elf' \) -print | sort || true

          copy_bin() {
            local src="$1"
            local dest="$2"
            if [ -f "${src}" ]; then
              cp "${src}" "${dest}"
              echo "Copied ${src} -> ${dest}"
              return 0
            fi
            return 1
          }

          if ! copy_bin "${PIOENV}/firmware.factory.bin" "${PREFIX}.factory.bin.espbinpatch" \
            && ! copy_bin "${IDF_BUILD}/${DEVICE_NAME}.factory.bin" "${PREFIX}.factory.bin.espbinpatch" \
            && ! copy_bin "${IDF_BUILD}/firmware.factory.bin" "${PREFIX}.factory.bin.espbinpatch"; then
            echo "No factory firmware binary found under ${BUILD_DIR}"
            exit 1
          fi

          if ! copy_bin "${PIOENV}/firmware.ota.bin" "${PREFIX}.ota.bin.espbinpatch" \
            && ! copy_bin "${IDF_BUILD}/${DEVICE_NAME}.ota.bin" "${PREFIX}.ota.bin.espbinpatch" \
            && ! copy_bin "${PIOENV}/firmware.bin" "${PREFIX}.ota.bin.espbinpatch" \
            && ! copy_bin "${IDF_BUILD}/${DEVICE_NAME}.bin" "${PREFIX}.ota.bin.espbinpatch"; then
            echo "No OTA firmware binary found under ${BUILD_DIR}"
            exit 1
          fi

          python3 -c '
          import sys
          from pathlib import Path
          needles = [
              b"ESPBINPATCH_WIFI_SSID___________",
              b"ESPBINPATCH_WIFI_PASSWORD______________________________________",
              b"ESPBINPATCH_OTA_PASSWORD________________________________________",
              b"ESPBINPATCH_API_ENCRYPTION_KEY__",
          ]
          for path in sys.argv[1:]:
              data = Path(path).read_bytes()
              missing = [n.decode() for n in needles if n not in data]
              if missing:
                  raise SystemExit(f"{path} missing placeholders: {missing}")
              print(f"placeholders ok: {path}")
          ' "${PREFIX}.factory.bin.espbinpatch" "${PREFIX}.ota.bin.espbinpatch"

          ls -lh "${OUT_DIR}"

      - name: Restore YAML after compile
        if: steps.check_tag.outputs.exists == 'false'
        run: git checkout -- g32-display.yaml

      - name: Update Changelog (BEFORE tagging)
        if: >-
          steps.check_tag.outputs.exists == 'false'
          && !contains(github.event.head_commit.message, '[skip ci]')
        run: |
          DATE=$(date +%Y-%m-%d)
          MESSAGE="${{ env.MESSAGE }}"
          VERSION="${{ env.VERSION }}"

          # Format changes: take each non-empty line, strip optional leading '- ' or dashes/spaces, then prefix with '   - '
          INDENTED=$(echo "$MESSAGE" | grep -v '^$' | sed -E 's/^\s*-?\s*(.*)$/   - \1/')

          # Rebuild changelog: headline → new entry header → bullets (if any) → old content (skipping any leading blank lines)
          {
            echo "# Changelog"
            echo "* [$DATE] $VERSION"
            echo "$INDENTED"
            tail -n +2 changelog.md | sed -n '/[^[:space:]]/,$p'
          } > temp_changelog.md

          mv temp_changelog.md changelog.md

          # Commit and push the updated changelog
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"
          git add changelog.md
          git commit -m "update changelog for $VERSION [skip ci]" || echo "No changes to commit"
          git push origin HEAD:${{ github.ref_name }} || echo "Push may have failed (already pushed?)"

      - name: Create annotated tag and push (AFTER changelog commit is pushed)
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          git tag -a "${{ env.TAG_NAME }}" -m "${{ env.MESSAGE }}"
          git push origin "${{ env.TAG_NAME }}"

      - name: Create/Release GitHub Release
        if: steps.check_tag.outputs.exists == 'false'
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.TAG_NAME }}
          name: ${{ env.VERSION }}
          body: |
            ${{ env.MESSAGE }}

            ---

            These files are compiled firmware with placeholder Wi-Fi / OTA / Home Assistant values.
            Do not flash them as-is. Patch them in [ESP Bin Patcher](https://sagdusmir.github.io/ESP-bin-patcher/?lock=1&chip=ESP32-S3&flash=erase&pad=00&patch=0&old=ESPBINPATCH_WIFI_SSID___________&new=YOUR_WIFI_SSID&enc=utf-8&old=ESPBINPATCH_WIFI_PASSWORD______________________________________&new=YOUR_WIFI_PASSWORD&enc=utf-8&old=ESPBINPATCH_OTA_PASSWORD________________________________________&new=YOUR_OTA_PASSWORD&enc=utf-8&old=ESPBINPATCH_API_ENCRYPTION_KEY__&new=YOUR_HA_API_KEY&enc=auto) (Chrome or Edge), then install over USB.
            Use the downloaded `.espbinpatch` file on that page.

            Hardware (pick one):
            - `*-buzzer.*` — passive piezo buzzer on GPIO (P2)
            - `*-speaker.*` — speaker on the SPEAK header (P6, external DAC)

            Flash type:
            - `*.factory.bin.espbinpatch` — first flash (erase everything)
            - `*.ota.bin.espbinpatch` — later updates (keep saved settings)
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: firmware/*.espbinpatch,g32-display-with-buzzer.yaml,g32-display-with-speaker.yaml
          artifactErrorsFailBuild: true
          allowUpdates: false
          draft: false
          prerelease: false
          makeLatest: true
          immutableCreate: true
