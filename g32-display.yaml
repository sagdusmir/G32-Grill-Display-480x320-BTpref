          - lvgl.widget.update:
              id: settings_hide_timer_switch
              state:
                checked: !lambda |-
                  return id(settings_hide_timer) == 0;
          - lvgl.widget.update:
              id: settings_enable_temperature_limits_switch
              state:
                checked: !lambda |-
                  return id(settings_enable_temperature_limits);
          - lvgl.widget.update:
