script:
  - id: time_update
    then:
      - if:
          condition:
            lambda: 'return id(settings_show_time_persistent);'
          then:
            - lvgl.label.update:
                id: display_time
                text: !lambda |-
                  static char time_buf[16];
                  auto now = id(my_time).now();
                  snprintf(time_buf, sizeof(time_buf), "%02d:%02d:%02d", now.hour, now.minute, now.second);
                  return time_buf;
            - lvgl.label.update:
                id: display_time
                hidden: !lambda |-
                  return (!id(settings_show_time_persistent) && id(settings_hide_timer_persistent));
      - if:
          condition:
            lambda: 'return (!id(settings_show_time_persistent) && !id(settings_hide_timer_persistent));'
          then:
            - lvgl.label.update:
                id: display_time
                text: "00:00:00"

  - id: timer_update
    then:
      - lvgl.label.update:
          id: timer_value
          text: !lambda |-
            if( id(timer_active) == true ) {
              if( id(timer_s) > 0 )
              {
                id(timer_s) -= 1;
              }
              else
              {
                if( id(timer_m) > 0 )
                {
                  id(timer_s) = 59;
                  id(timer_m) = id(timer_m) - 1;
                }
                else
                {
                  if( id(timer_h) > 0 )
                  {
                    id(timer_s) = 59;
                    id(timer_m) = 59;
                    id(timer_h) = id(timer_h) - 1;
                  }
                  else
                  {
                    if( id(timer_alarm) == false ) {
                      id(timer_alarm) = true;
                      id(my_rtttl).play("${Timer_Alarm_Sound}");
                    }
                  }
                }
              }
              if( id(timer_alarm) == false ) {
                static char time_buf[16];
                snprintf(time_buf, sizeof(time_buf), "%02d:%02d:%02d", id(timer_h), id(timer_m), id(timer_s));
                return time_buf;
              } else {
                return ("00:00:00");
              }
            } else {
              return ("");
            }
      - lvgl.label.update:
          id: timer_value
          text_color: !lambda |-
            if( id(timer_alarm) == true ) {
              return lv_color_hex(id(color_bad));
            } else {
              return lv_color_hex(id(color_100));
            }

  - id: apply_mac_address
    then:
        # this ensures the ble_client changes MAC at runtime
        - lambda: !lambda |-
            uint64_t addr = 0;
            uint64_t b1, b2, b3, b4, b5, b6;
            if (sscanf(id(settings_g32_mac_address_persistent).c_str(), "%llx:%llx:%llx:%llx:%llx:%llx", &b1, &b2, &b3, &b4, &b5, &b6) == 6) {
              addr = (b1 << 40) | (b2 << 32) | (b3 << 24) | (b4 << 16) | (b5 << 8) | b6;
            }
            id(ow_g32).set_address(addr);
            ESP_LOGI("settings", "set G32 MAC address to %s", id(settings_g32_mac_address_persistent).c_str());

  - id: apply_wifi
    then:
      - globals.set:
          id: apply_wifi_started_by_user
          value: 'true'
      - wifi.disable:
      - delay: 1s
      - wifi.configure:
          ssid: !lambda |-
            return id(settings_wifi_ssid_persistent);
          password: !lambda |-
            return id(settings_wifi_password_persistent);
      - wifi.enable:

  - id: apply_meater_mac_addresses
    then:
        # this ensures the ble_client changes MAC at runtime
        - lambda: !lambda |-
            std::array<esphome::ble_client::BLEClient *, 4> meaters = {id(meater0), id(meater1), id(meater2), id(meater3)};
            std::string t_meater_mac_addresses = id(settings_meater_mac_addresses_persistent);
            for (int i = 0; i < 4; i++) {
              std::string mac = t_meater_mac_addresses.substr(i * 18, 17);
              uint64_t addr = 0;
              uint64_t b1, b2, b3, b4, b5, b6;
              if (sscanf(mac.c_str(), "%llx:%llx:%llx:%llx:%llx:%llx", &b1, &b2, &b3, &b4, &b5, &b6) == 6) {
                addr = (b1 << 40) | (b2 << 32) | (b3 << 24) | (b4 << 16) | (b5 << 8) | b6;
              }
              meaters[i]->set_address(addr);
              ESP_LOGI("settings", "set meater%d MAC address to %s", i, mac.c_str());
            }
  - id: apply_ota_password
    then:
       - lambda: !lambda |-
           id(my_ota).set_auth_password(id(settings_ota_password_persistent));
  - id: hide_boot_screen
    then:
      - if:
          condition:
            lambda: 'return !id(boot_screen_hidden);'
          then:
            - script.execute: apply_mac_address
            - script.execute: apply_wifi
            - script.execute: apply_ota_password
            - script.execute: apply_meater_mac_addresses
            - lambda: |-
                id(settings_color_scheme_idx) = id(settings_color_scheme_idx_persistent);
                id(apply_color_scheme).execute();
            - lvgl.widget.hide: boot_screen
            - lvgl.widget.show: [status_bar_top, status_bar_bottom]

            # some things to refresh from persisted settings
            - lvgl.widget.refresh: [battery_symbol_obj, display_time]

            # for settings_enable_temperature_limits_persistent and settings_hide_inactive_sensors_persistent
            - lvgl.widget.refresh: [zone1_label, zone2_label, zone3_label, zone4_label]
            - lvgl.widget.refresh: [zone1_arc, zone2_arc, zone3_arc, zone4_arc]
            - lvgl.widget.refresh: [zone1_limit_arc, zone2_limit_arc, zone3_limit_arc, zone4_limit_arc]
            - lvgl.widget.refresh: [zone1_limit_label, zone2_limit_label, zone3_limit_label, zone4_limit_label]
            - lvgl.widget.refresh: [zone1_limit_label_bell, zone2_limit_label_bell, zone3_limit_label_bell, zone4_limit_label_bell]
            - lvgl.widget.refresh: [sensor1_obj, sensor2_obj, sensor3_obj, sensor4_obj]
            - lvgl.widget.refresh: [sensor1_label, sensor2_label, sensor3_label, sensor4_label]
            - lvgl.widget.refresh: [sensor1_limit_arc, sensor2_limit_arc, sensor3_limit_arc, sensor4_limit_arc]
            - lvgl.widget.refresh: [sensor1_limit_label, sensor2_limit_label, sensor3_limit_label, sensor4_limit_label]
            - lvgl.widget.refresh: [sensor1_limit_label_bell, sensor2_limit_label_bell, sensor3_limit_label_bell, sensor4_limit_label_bell]
            - lvgl.widget.refresh: [sensor1_battery, sensor2_battery, sensor3_battery, sensor4_battery]
            - globals.set:
                id: boot_screen_hidden
                value: 'true'

  - id: show_temperatures_page
    then:
      - lvgl.widget.hide: [settings_status_bar_top, my_keyboard, settings_about]
      - lvgl.widget.show: status_bar_bottom
      - lvgl.page.show: arcs_page
      - script.execute: ble_g32_scan_stop
      - script.execute: ble_meater_scan_stop
      - lvgl.widget.hide: settings_persist_hint

  - id: ble_g32_scan_start
    then:
      - globals.set:
          id: ble_g32_scan_started_by_user
          value: 'true'
      - lvgl.widget.show: settings_g32_mac_address_abort_button
      - lvgl.widget.hide: [settings_g32_mac_address_search_button, settings_mac_address_updated]

  - id: ble_g32_scan_stop
    then:
      - globals.set:
          id: ble_g32_scan_started_by_user
          value: 'false'
      - lvgl.widget.hide: settings_g32_mac_address_abort_button
      - lvgl.widget.show: settings_g32_mac_address_search_button
      - lvgl.widget.refresh: settings_mac_address_label

  - id: ble_meater_scan_start
    then:
      - globals.set:
          id: ble_meater_scan_started_by_user
          value: 'true'
      - globals.set:
          id: ble_meaters_found
          value: '0'
      - lambda: |-
          id(settings_meater_mac_addresses) = {
            "${meater_mac_address}",
            "${meater_mac_address}",
            "${meater_mac_address}",
            "${meater_mac_address}"
          };
      - lvgl.widget.hide: [settings_meater0_updated, settings_meater1_updated, settings_meater2_updated, settings_meater3_updated]
      - lvgl.widget.hide: settings_meater_mac_addresses_search_button
      - lvgl.widget.show: settings_meater_mac_addresses_abort_button
      - lvgl.widget.refresh: [settings_meater0_label, settings_meater1_label, settings_meater2_label, settings_meater3_label]

  - id: ble_meater_scan_stop
    then:
      - globals.set:
          id: ble_meater_scan_started_by_user
          value: 'false'
      - lvgl.widget.show: settings_meater_mac_addresses_search_button
      - lvgl.widget.hide: settings_meater_mac_addresses_abort_button

  - id: check_for_updates
    then:
      - http_request.get:
          url: ${url_check_for_updates}
          request_headers:
            Accept: application/vnd.github.v3+json
            User-Agent: ESPHome
          max_response_buffer_size: 4096
          capture_response: true
          on_response:
            then:
              - if:
                  condition:
                    lambda: 'return response->status_code == 200;'
                  then:
                    - lambda: |-
                        ESP_LOGI("VersionCheck", "returned");
                        json::parse_json(body, [](JsonObject root) -> bool {
                          if (root["name"].is<std::string>()) {
                            id(latest_version) = root["name"].as<std::string>();
                            return true;
                          }
                          return false;
                        });
                    - lvgl.widget.refresh: [latest_version_label1, latest_version_label2]
                  else:
                    - logger.log:
                        format: "HTTP VersionCheck request failed with status %d"
                        args: ['response->status_code']


          on_error:
            then:
            - logger.log: "Failed to perform HTTP request for version check."
  - id: apply_color_scheme
    then:
      - lambda: |-
          int target_idx = id(settings_color_scheme_idx);   // current selected index (0,1,2,3)
          const std::vector<uint32_t>* selected_vec = nullptr;
          std::string selected_name = "unknown";

          // First: find the matching scheme by index (vec[0])
          for (const auto& pair : id(color_schemes)) {
            const auto& vec = pair.second;
            if (vec.empty()) continue;

            int scheme_idx = static_cast<int>(vec[0]);   // your 0,1,2,3
            if (scheme_idx == target_idx) {
              selected_vec = &vec;         // remember the correct vector
              selected_name = pair.first;  // remember the name for logging
              break;                       // found it → exit loop early
            }
          }

          // If nothing found (corrupted data?), fall back to first scheme (index 0)
          if (!selected_vec) {
            ESP_LOGW("color_scheme", "Invalid index %d → falling back to default (white)", target_idx);
            for (const auto& pair : id(color_schemes)) {
              const auto& vec = pair.second;
              if (vec.empty()) continue;
              if (static_cast<int>(vec[0]) == 0) {
                selected_vec = &vec;
                selected_name = pair.first;
                id(settings_color_scheme_idx) = 0;
                id(settings_color_scheme_idx_persistent) = 0;
                break;
              }
            }
          }

          if (selected_vec && selected_vec->size() >= 8) {
            id(color_100)   = (*selected_vec)[1];
            id(color_75)    = (*selected_vec)[2];
            id(color_50)    = (*selected_vec)[3];
            id(color_25)    = (*selected_vec)[4];
            id(color_good)  = (*selected_vec)[5];
            id(color_bad)   = (*selected_vec)[6];
            id(color_light) = (*selected_vec)[7];

            // THIS SCHOULD BE THE MAGIC LINE: tells every LVGL object that styles changed
            // BUT: DOES NOT WORK at the moment
            lv_obj_report_style_change(NULL);

            ESP_LOGI("color_scheme", "Applied scheme '%s' (index %d)", selected_name.c_str(), target_idx);
          } else {
            ESP_LOGE("color_scheme", "Failed to apply color scheme – data invalid");
          }
      - lambda: |-
          lv_obj_set_style_arc_color(boot_spinner, lv_color_hex(id(color_100)), LV_PART_INDICATOR);
      - lvgl.widget.refresh:
          - cs_title
          - battery_symbol
          - battery_soc_shadow
          - battery_soc_label
          - battery_soc_label_unit
          - g32bt_connect_label
          - wifi_connect_label
          - firebox_open_label
          - light_on_label
          - warning_on_label
          - display_time_shadow
          - display_time
          - timer_value_bg
          - timer_value
          - gas_icon
          - gas_percent_bar
          - gas_percent_label_shadow
          - gas_percent_label
          - gas_percent_label_unit
          - gas_weight_label_shadow
          - gas_weight_label
          - gas_weight_symbol
          - settings_status_bar_top_bar
          - settings_status_bar_top_title
          - settings_status_bar_top_version
          - latest_version_label1
          - latest_version_label2
          - current_version_label1
          - current_version_label2
          - zones_bar
          - zones_title
          - zone1_obj
          - zone1_obj_unit
