#-------------------------------------------
# Time platform
#-------------------------------------------
time:
  id: my_time

  platform: sntp
  servers:
    - ntp0.ntp-servers.net
    - ntp1.ntp-servers.net
    - ntp2.ntp-servers.net

  # alternatively
  # platform: homeassistant  # no advantage over sntp

  # timezone: "Europe/Berlin"  # should be detected automatically during build process
  on_time_sync:
    - script.execute: time_update
  on_time:
    - seconds: '*'
      then:
        - script.execute: time_update

#-------------------------------------------
# LVGL library for displays
#-------------------------------------------
lvgl:
  draw_rounding: 8 # necessary for the axs15231 display controller
  displays: my_display
  touchscreens: my_touch
  bg_color: 0
  border_width: 0
  outline_width: 0
  theme:
    label:
      bg_color: 0
      bg_opa: COVER
      width: 120
      text_align: CENTER
    bar:
      radius: 5
      indicator:
        radius: 5
        arc_color: red
    arc:
      radius: 5
      indicator:
        arc_rounded: false
        radius: 5
    roller:
      text_font: MONTSERRAT_20
      width: 60
      selected:
        text_font: MONTSERRAT_BOLD_FONT_18
    slider:
      bg_opa: COVER
      radius: 0
      adv_hittest: true
      border_width: 0
      indicator:
        radius: 0
      knob:
        radius: 2

    textarea:
      width: 340
      height: 30
      text_font: MONTSERRAT_18
      border_width: 1
    keyboard:
      text_color: ${COLOR_100}
      bg_color: ${COLOR_25}
      items:
        bg_color: ${COLOR_100}
        text_color: ${COLOR_25}

  style_definitions:
    - id: arc_value_style
      x: 8
      y: 15
      width: 104
      height: 104
      arc_opa: COVER
      arc_rounded: false
      arc_width: 6
    - id: arc_limit_style
      x: 13
      y: 21
      width: 94
      height: 94
      arc_opa: 100%
      arc_rounded: false
      arc_width: 3
      arc_color: 0
    - id: item_obj_style
      width: 120
      height: 120
      bg_color: 0
      pad_all: 0
      radius: 0
      outline_width: 0
      border_width: 0
      border_side: NONE
      outline_pad: 0

  # send display to idle state after timeout
  on_idle:
    timeout: !lambda "return(id(settings_display_timeout_value_persistent) * 1000);"
    then:
    - if:
        condition:
          - lambda: "return id(settings_display_timeout_value_persistent) > 0;"
        then:
          - logger.log: "Display is idle"
          - light.turn_off: backlight
          - lvgl.pause:

  # boot screen with spinner - just for fun
  top_layer:
    widgets:
      - obj:
          id: boot_screen
          x: 0
          y: 0
          width: 480
          height: 320
          bg_color: 0
          bg_opa: COVER
          radius: 0
          pad_all: 0
          border_width: 0
          widgets:
            - spinner:
                id: boot_spinner
                align: CENTER
                spin_time: 1s
                arc_length: 60deg
                arc_width: 4
                arc_color: 0
                indicator:
                  arc_color: 0  # overridden after color scheme is known
                  arc_width: 4
      - obj:
          id: status_bar_top
          x: 0
          y: 0
          width: 480
          height: 22
          bg_color: 0
          bg_opa: COVER
          pad_all: 0
          border_width: 0
          hidden: true
          radius: 0
          widgets:            
            - label: # label for entering settings
                id: cs_title
                x: 0
                y: -4
                text_font: MONTSERRAT_BOLD_FONT_22
                text_color: !lambda return lv_color_hex(id(color_100));
                text_align: LEFT
                long_mode: CLIP
                width: 185
                height: 22
                text: "G32 Connected"

                clickable: true
                on_press:
                  - if:
                      condition:
                        or:
                          - lambda: 'return lv_scr_act() == id(arcs_page)->obj;'
                      then:
                        - lvgl.page.show: settings_page

            - obj: # symbol for batter low warning
                id: battery_symbol_obj
                x: 425
                y: 0
                width: 55
                height: 22
                bg_color: 0
                pad_all: 0
                outline_width: 0
                border_width: 0
                border_side: NONE
                radius: 0
                hidden: !lambda |-
                  return id(settings_hide_soc_persistent);
                widgets:
                  - label:
                      id: battery_symbol
                      x: 3
                      y: -2
                      text_font: ICON_FONT_24
                      text_align: CENTER
                      width: 24
                      text_color: !lambda |-
                        if( id(battery_soc_value) <= id(settings_min_soc_value_persistent) ) {
                          return lv_color_hex(id(color_bad));
                        }
                        return lv_color_hex(id(color_good));
                      text: !lambda |-
                        const char* icons[4] = {"\U000F008E","\U000F12A1","\U000F12A2","\U000F12A3"};
                        float soc = id(battery_soc_value);
                        int idx = soc <= 15 ? 0 :
                            soc <= 40 ? 1 :
                            soc <= 80 ? 2 : 3;
                        return icons[idx];

                  - label:  # battery soc background
                      id: battery_soc_shadow
                      x: 21
                      y: 7
                      text_font: SEGMENT_FONT_8
                      text_align: RIGHT
                      width: 22
                      text_color: !lambda return lv_color_hex(id(color_25));
                      text: "188"
                  - label:
                      id: battery_soc_label
                      x: 21
                      y: 7
                      text_font: SEGMENT_FONT_8
                      text_align: RIGHT
                      bg_opa: TRANSP
                      width: 22
                      text_color: !lambda |-
                        if( id(battery_soc_value) <= id(settings_min_soc_value_persistent) ) {
                          return lv_color_hex(id(color_bad));
                        }
                        return lv_color_hex(id(color_good));
                      text: !lambda |-
                        return (to_string(static_cast<int>(id(battery_soc_value)))).c_str();
                  - label:
                      id: battery_soc_label_unit
                      x: 44
                      y: 3
                      text_font: MONTSERRAT_12
                      text_align: LEFT
                      width: 7
                      text_color: !lambda |-
                        if( id(battery_soc_value) <= id(settings_min_soc_value_persistent) ) {
                          return lv_color_hex(id(color_bad));
                        }
                        return lv_color_hex(id(color_good));
                      text: "%"
            - label: # symbol for successfull BT connection
                id: g32bt_connect_label
                x: 404
                y: -2
                text_font: ICON_FONT_24
                text_align: CENTER
                width: 24
                text_color: !lambda |-
                  if( id(g32_connected) ) {
                    return lv_color_hex(id(color_good));
                  }
                  return lv_color_hex(id(color_25));
                text: "\U000F00AF"
            - label: # symbol for successfull WIFI connection
                id: wifi_connect_label
                x: 380
                y: 0
                text_font: MONTSERRAT_18
                text_align: CENTER
                width: 24
                text_color: !lambda |-
                  if( id(wifi_connected) ) {
                    return lv_color_hex(id(color_good));
                  }
                  return lv_color_hex(id(color_25));
                text: "\uF1EB" # WIFI symbol
            - label: # symbol for 'firebox open'
                id: firebox_open_label
                x: 356
                y: 1
                text_font: MONTSERRAT_18
                text_align: CENTER
                width: 24
                text_color: !lambda |-
                  if( id(firebox_open) ) {
                    return lv_color_hex(id(color_good));
                  }
                  return lv_color_hex(id(color_25));
                text: "\uF093" # arrow up
            - label: # symbol for 'light on'
                id: light_on_label
                x: 332
                y: -2
                text_font: ICON_FONT_24
                text_align: CENTER
                width: 24
                text_color: !lambda |-
                  if( id(light_on) ) {
                    return lv_color_hex(id(color_light));
                  }
                  return lv_color_hex(id(color_25));
                text: "\U000F1A4E"
            - label:
                id: warning_on_label
                x: 308
                y: 1
                text_font: MONTSERRAT_18
                text_color: !lambda |-
                  if( id(g32_connected) && (id(warning_on) || ( id(battery_soc_value) <= id(settings_min_soc_value_persistent) ) || ( id(gas_percent) <= id(settings_min_gas_value_persistent)) )) {
                    return lv_color_hex(id(color_bad));
                  }
                  return lv_color_hex(id(color_25));
                text_align: CENTER
                width: 24
                text: "\uF071"
            - label: # time background
                id: display_time_shadow
                x: 188
                y: 0
                text_font: SEGMENT_FONT_20
                text_color: !lambda return lv_color_hex(id(color_25));
                text_align: CENTER
                bg_color: 0
                width: 104
                text: "88:88:88"
                hidden: !lambda |-
                  return (!id(settings_show_time_persistent) && id(settings_hide_timer_persistent));
            - label: # time hours:minutes:seconds
                id: display_time
                x: 188
                y: 0
                text_font: SEGMENT_FONT_20
                text_color: !lambda return lv_color_hex(id(color_100));
                text_align: CENTER
