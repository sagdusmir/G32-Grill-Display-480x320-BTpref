substitutions:
  # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # #
  # You will propably need to do changes only to the following lines (if at all): #
  # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # #

  # Name of the ESPHome device (modify if you like, avoid special characters)
  name: g32-display-bt90
  device_description: "Monitor an OW G32 grill"
  version: "BTpref-retro 2.3.2"
  url_qrcode: "https://github.com/sagdusmir/G32-Grill-Display-480x320-BTpref"
  url_check_for_updates: "https://api.github.com/repos/sagdusmir/G32-Grill-Display-480x320-BTpref/releases/latest"

  # Enter data of the newly created Home Assistant ESPHome device. Example:
  api_encryption_key: "E1fyywUUE1DWzu0OzhDkyc4yAnfGwyEfsVNvhytrU6k="

  # over-the-air updates (ESPHome CLI or Home Assistant add-On)
  # Hint: if you changed this value on the device, you might have to alter
  # this value here to match it. esphome cli uses the value from the yaml for the ota update!
  ota_password: "7fdf9f656d36180bfba92d596c9e7db3"

  # Some color themes:
  #
  # All consist of a primary color and three additional
  # colors of reduced luminocity.
  # -> color_100, ... color_25
  #
  # In addition to that there is a "good" and a "bad"
  # color. For a less colorful UI you could just use
  # the primary color for "good", too. But I suggest
  # having a popping color for the "bad" stuff.
  # -> color_good, color_bad
  #
  # Last but not least, there is a separate color for
  # the light bulb symbol...which I usually do not change.
  # -> color_light
  #
  # The idx column is important and used to identify the select color theme.

  COLOR_SCHEMES: |
    //               idx 100%      75%       50%       25%       GOOD      BAD       LIGHT
    {
      {"white",      {0, 0xffffff, 0xbfbfbf, 0x808080, 0x404040, 0x8bff85, 0xff5757, 0xffff00}},
      {"amber",      {1, 0xffb900, 0xbd8a00, 0x805d00, 0x392900, 0x58b100, 0xff5600, 0xffff00}},
      {"cyan",       {2, 0x68e2fb, 0x00acbf, 0x007582, 0x003c43, 0x75fb8a, 0xea838d, 0xffff00}},
      {"night red",  {3, 0xff0059, 0xc00044, 0x80002e, 0x400018, 0xff0059, 0xe4d300, 0xffff00}},
      {"green",      {4, 0x06bd00, 0x058d00, 0x046f00, 0x003008, 0x00ff00, 0xfe3a03, 0xffff00}},
      {"night blue", {5, 0x1a00ff, 0x1300b6, 0x0d007a, 0x040028, 0x00ff4d, 0xff0092, 0xffff00}},
      {"purple",     {6, 0xff00e4, 0xc000ac, 0x800073, 0x32002d, 0x00ffb0, 0xff1100, 0xffff00}},
      {"yellow",     {7, 0xffda00, 0xbea300, 0x806d00, 0x262000, 0x64dc00, 0xff5900, 0xffff00}}
    }

  # shades of white (initial start values since substitutions work best)
  COLOR_100:   "0xffffff"  # 100% brightness
  COLOR_75:    "0xbfbfbf"  #  75%
  COLOR_50:    "0x808080"  #  50%
  COLOR_25:    "0x404040"  #  25%
  COLOR_GOOD:  "0x8bff85"
  COLOR_BAD:   "0xff5757"
  COLOR_LIGHT: "0xffff00"

  # max temperature for zones and sensors
  Zone_Max: "500"
  Sensor_Max: "130"

  # Speaker (beeper) "volume" setting. 1.0 = max, 0.1 = min.
  # A higher value might lead to clipping. Check what works out best for you.
  Beeper_Max: "0.8"

  # interval for alarm sound
  Beeper_interval: "5s"

  # sounds (in RTTTL syntax):
  G32_Connect_Sound: "pling2:d=16,o=6,b=140:e6,32p,d6"
  G32_Disconnect_Sound: "siren:d=8,o=5,b=100:d,e,d,e,d,e,d,e"
  MT_Connect_Sound: "Pling4:d=16,o=5,b=100:a5,32p,a6"
  MT_Disconnect_Sound: "plonk:d=16,o=5,b=100:a6,32p,a5"
  Wifi_Connect_Sound: "dadi:d=16,o=6,b=140:d6,32p,e6"
  Wifi_Disconnect_Sound: "siren:d=8,o=5,b=100:d,e,d,e,d,e,d,e"
  Timer_Alarm_Sound: "didididi:d=16,o=6,b=140:e6,32p,e6,32p,e6,32p,e6"
  Zone_Limit_Alarm_Sound: "dadidadi:d=8,o=5,b=150:d,e,d,e,d,e,d,e"
  Sensor_Limit_Alarm_Sound: "didadida:d=8,o=5,b=150:e,d,e,d,e,d,e,d"
  New_MAC_Sound: "click:d=32,o=6,b=120:32c,32p"

  # D A N G E R  Z O N E! # # # # # # # # # # # # # # # # # # # # # # # # # # # # 
  # From here on, please only make changes if you know what you are doing and   #
  # have an idea of what you want to achieve. :)                                #
  # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # #

  g32_mac_address: 94:E6:86:00:00:00
  g32_service_uuid: dc0f41ea-b6ae-46a8-a19e-1a3bf4342bcb
  g32_characteristic_uuid_tx: 'dc0f41e2-b6ae-46a8-a19e-1a3bf4342bcb'
  # g32_characteristic_uuid_rx: 'dc0f41e1-b6ae-46a8-a19e-1a3bf4342bcb'  # from the original OW app

  wifi_ssid: "wifi_ssid"
  wifi_password: "password"

  meater_mac_address: B8:1F:5E:00:00:00
  meater_service_uuid: 'a75cc7fc-c956-488f-ac2a-2dbc08b63a04'
  meater_characteristic_uuid_temp: '7edda774-045e-4bbf-909b-45d1991a2876'
  meater_characteristic_uuid_battery: '2adb4877-68d8-4884-bd3c-d83853bf27b8'

  Invalid_Sensor_Value: '1500'  # 1500 (and above) means "invalid"

esphome:
  name: ${name}
  build_path: /tmp/esphome_build
  platformio_options:
    upload_speed: 921600
    board_build.flash_mode: dio
    board_build.f_flash: 80000000L
    board_build.f_cpu: 240000000L

  project:
    name: "g32.bt_display480_320"
    version: ${version}

  on_boot:
    priority: 1100 # stay above 1000 and below 1500!
    then:
      - lambda: id(boot_start_time) = millis();
                // the following line prevents the wifi password
                // from being shown - but makes it nearly impossible
                // to enter a complex password at all.
                // lv_textarea_set_password_show_time(id(settings_wifi_password_textarea), 0);  # 0 ms = hide immediately

esp32:
  board: esp32-s3-devkitc-1
  # variant: esp32S3  # use either board: or variant
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      # CONFIG_ESP_TASK_WDT_EN: n  # Disables Task Watchdog Timer (TWDT)
      # CONFIG_ESP_INT_WDT: n      # Disables Interrupt Watchdog Timer (IWDT)
      # COMPILER_OPTIMIZATION_SIZE: "y"  # optimize for size
      CONFIG_COMPILER_OPTIMIZATION_PERF: "y"
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"
      CONFIG_SPIRAM_RODATA: "y"

psram:
  mode: octal
  speed: 80MHz # 120mhz is not supported and falls back to 40mhz

logger:
  baud_rate: 921600  # enable logging
  # baud_rate: 0  # no logging -> saves power

api: # enable Home Assistant API
  encryption:
    key: ${api_encryption_key}
  reboot_timeout: 0s  

http_request:
  # optional global defaults (recommended for reliability)
  timeout: 5s
  verify_ssl: true
  follow_redirects: true

ota:
  - platform: esphome
    id: my_ota
    password: ${ota_password}

wifi:
  id: my_wifi
  ssid: ${wifi_ssid}  # must be dynamically applied later
  password: ${wifi_password}  # must be dynamically applied later
  fast_connect: True
  reboot_timeout: 0s
  on_connect:
    then:
      - rtttl.play: ${Wifi_Connect_Sound}
      - globals.set:
          id: wifi_connected
          value: 'true'
      - globals.set:
          id: apply_wifi_started_by_user
          value: 'false'
      - lvgl.widget.refresh: wifi_connect_label
      - script.execute: check_for_updates

  on_disconnect:
    then:
      - if: # no sound if user updated credentials
          condition:
            - lambda: |-
                return !(id(apply_wifi_started_by_user));
          then:
            - rtttl.play: ${Wifi_Disconnect_Sound}
      - globals.set:
          id: wifi_connected
          value: 'false'
      - lvgl.widget.refresh: wifi_connect_label
esp32_ble:
  # 1xG32, 4xMeater probes -> maximum 5 connections needed
  max_connections: 5  # new option since 2025.10.15, used to be under the esp32_ble_tracker component

esp32_ble_tracker:
  # 1xG32, 4xMeater probes -> maximum 5 connections needed
  # max_connections: 5  # up till esphome 2025.9.1. now moved to esp32_ble component.
  on_ble_advertise:
    then:
      - lambda: |-
          if (x.get_name().rfind("OWG-G32C", 0) == 0 && id(ble_g32_scan_started_by_user)) {
            id(settings_g32_mac_address) = x.address_str();
            lv_obj_clear_flag(id(settings_mac_address_updated), LV_OBJ_FLAG_HIDDEN);
            id(my_rtttl).play("${New_MAC_Sound}");
            ESP_LOGI("ble_adv", "G32 MAC address: %s", x.address_str().c_str());
            id(ble_g32_scan_stop).execute();
          }

          if ((x.get_name() == "MEATER" || x.get_name() == "MEATER+") && id(ble_meater_scan_started_by_user)) {
            if (id(ble_meaters_found) < 15) {
              if (!x.get_manufacturer_datas().empty() && !x.get_manufacturer_datas()[0].data.empty()) {  // assert data is available
                int probe_id = x.get_manufacturer_datas()[0].data[0];  // first data byte
                if (probe_id > 0 && probe_id < 5) {
                  int idx = probe_id-1;
                  if ((id(ble_meaters_found) & (1 << idx)) == 0) {
                    id(ble_meaters_found) |= (1 << idx);
                    id(my_rtttl).play("${New_MAC_Sound}");
                    ESP_LOGI("ble_adv", "Meater MAC address: %s", x.address_str().c_str());
                    id(settings_meater_mac_addresses)[idx] = x.address_str();
                    std::array<lv_obj_t *, 4> meater_labels = {id(settings_meater0_label), id(settings_meater1_label), id(settings_meater2_label), id(settings_meater3_label)};
                    std::array<lv_obj_t *, 4> meater_updated = {id(settings_meater0_updated), id(settings_meater1_updated), id(settings_meater2_updated), id(settings_meater3_updated)};
                    lv_obj_clear_flag(meater_updated[idx], LV_OBJ_FLAG_HIDDEN);
                    lv_label_set_text(meater_labels[idx], x.address_str().c_str());
                  }
                }
              }
            }
            if (id(ble_meaters_found) >= 15) {
              id(ble_meater_scan_stop).execute();           
            }
          } 

          // some logging
          // if (x.get_name().rfind("OWG-G32C", 0) == 0) {
          //   ESP_LOGI("ble_adv", "G32 found");
          //   ESP_LOGI("ble_adv", "  Name: %s", x.get_name().c_str());
          //   ESP_LOGI("ble_adv", "  MAC address: %s", x.address_str().c_str());
          // }
          // if (x.get_name().rfind("MEATER+", 0) == 0) {
          //   ESP_LOGI("ble_adv", "Meater+ found");
          //   ESP_LOGI("ble_adv", "  Name: %s", x.get_name().c_str());
          //   ESP_LOGI("ble_adv", "  MAC address: %s", x.address_str().c_str());
          // }
          // if (x.get_name() == "MEATER") {
          //   ESP_LOGI("ble_adv", "Meater found");
          //   ESP_LOGI("ble_adv", "  Name: %s", x.get_name().c_str());
          //   ESP_LOGI("ble_adv", "  MAC address: %s", x.address_str().c_str());
          // }
          // if (x.get_name() == "MEATER BLOCK") {
          //   ESP_LOGI("ble_adv", "Meater Block found");
          //   ESP_LOGI("ble_adv", "  Name: %s", x.get_name().c_str());
          //   ESP_LOGI("ble_adv", "  MAC address: %s", x.address_str().c_str());
          // }

          // log everything we get on advertise
          if (0) {
            ESP_LOGD("ble_adv", "New BLE device");
            ESP_LOGD("ble_adv", "  address: %s", x.address_str().c_str());
            ESP_LOGD("ble_adv", "  RSSI: %d", x.get_rssi());
            ESP_LOGD("ble_adv", "  name: %s", x.get_name().c_str());
            ESP_LOGD("ble_adv", "  Advertised service UUIDs:");
            for (auto uuid : x.get_service_uuids()) {
              ESP_LOGD("ble_adv", "    - %s", uuid.to_string().c_str());
            }
            ESP_LOGD("ble_adv", "  Advertised service data:");
            for (auto data : x.get_service_datas()) {
              ESP_LOGD("ble_adv", "    - %s: (length %i)", data.uuid.to_string().c_str(), data.data.size());
              // To log the actual data bytes, you can add a loop here
              std::string hex_data;
              for (auto byte : data.data) {
                  char buf[3];
                  sprintf(buf, "%02X ", byte);
                  hex_data += buf;
                }
              ESP_LOGD("ble_adv", "      data: %s", hex_data.c_str());
            }
            ESP_LOGD("ble_adv", "  Advertised manufacturer data:");
            for (auto data : x.get_manufacturer_datas()) {
              ESP_LOGD("ble_adv", "    - %s: (length %i)", data.uuid.to_string().c_str(), data.data.size());
              // Similarly, log the data bytes
              std::string hex_data;
              for (auto byte : data.data) {
                  char buf[3];
                  sprintf(buf, "%02X ", byte);
                  hex_data += buf;
                }
              ESP_LOGD("ble_adv", "      data: %s", hex_data.c_str());
            }
          }


      - lvgl.widget.refresh: settings_mac_address_label
      - lvgl.widget.refresh: [settings_meater0_label, settings_meater1_label, settings_meater2_label, settings_meater3_label]

ble_client:
  - mac_address: ${g32_mac_address}  # must be dynamically applied later
    id: ow_g32
    on_connect:
      then:
        - rtttl.play: ${G32_Connect_Sound}
        - globals.set:
            id: g32_connected
            value: 'true'
        - lvgl.widget.refresh: g32bt_connect_label
    on_disconnect:
      then:
        - rtttl.play: ${G32_Disconnect_Sound}
        - globals.set:
            id: g32_connected
            value: 'false'
        - lvgl.widget.refresh: g32bt_connect_label
        - globals.set:
            id: gas_weight
            value: '-1'
        - lvgl.widget.refresh: gas_weight_label
        - globals.set:
            id: gas_percent
            value: '0'
        - lvgl.widget.refresh: [gas_percent_label, gas_percent_label_unit, gas_percent_bar]
        - globals.set:
            id: zone1_value
            value: ${Invalid_Sensor_Value}
        - globals.set:
            id: zone2_value
            value: ${Invalid_Sensor_Value}
        - globals.set:
            id: zone3_value
            value: ${Invalid_Sensor_Value}
        - globals.set:
            id: zone4_value
            value: ${Invalid_Sensor_Value}
        - globals.set:
            id: sensor1_value
            value: ${Invalid_Sensor_Value}
        - globals.set:
            id: sensor2_value
            value: ${Invalid_Sensor_Value}
        - globals.set:
            id: sensor3_value
            value: ${Invalid_Sensor_Value}
        - globals.set:
            id: sensor4_value
            value: ${Invalid_Sensor_Value}
        - globals.set:
            id: active_sensors
            value: "0"
        - lvgl.widget.refresh: [zone1_label, zone2_label, zone3_label, zone4_label]
        - lvgl.widget.refresh: [sensor1_label, sensor2_label, sensor3_label, sensor4_label]

  - mac_address: ${meater_mac_address}
    id: meater0
    on_connect:
      then:
        - lambda: |-
            id(active_meaters) |= 0x01;
        - rtttl.play: ${MT_Connect_Sound}
    on_disconnect:
      then:
        - lambda: |-
            id(active_meaters) &= ~0x01;
        - lambda: |-
            id(g32_probe1).publish_state(${Invalid_Sensor_Value});
        - rtttl.play: ${MT_Disconnect_Sound}
  - mac_address: ${meater_mac_address}
    id: meater1
    on_connect:
      then:
        - lambda: |-
            id(active_meaters) |= 0x02;
        - rtttl.play: ${MT_Connect_Sound}
    on_disconnect:
      then:
        - lambda: |-
            id(active_meaters) &= ~0x02;
        - lambda: |-
            id(g32_probe2).publish_state(${Invalid_Sensor_Value});
        - rtttl.play: ${MT_Disconnect_Sound}
  - mac_address: ${meater_mac_address}
    id: meater2
    on_connect:
      then:
        - lambda: |-
            id(active_meaters) |= 0x04;
        - rtttl.play: ${MT_Connect_Sound}
    on_disconnect:
      then:
        - lambda: |-
            id(active_meaters) &= ~0x04;
        - lambda: |-
            id(g32_probe3).publish_state(${Invalid_Sensor_Value});
        - rtttl.play: ${MT_Disconnect_Sound}
  - mac_address: ${meater_mac_address}
    id: meater3
    on_connect:
      then:
        - lambda: |-
            id(active_meaters) |= 0x08;
        - rtttl.play: ${MT_Connect_Sound}
    on_disconnect:
      then:
        - lambda: |-
            id(active_meaters) &= ~0x08;
        - lambda: |-
            id(g32_probe4).publish_state(${Invalid_Sensor_Value});
        - rtttl.play: ${MT_Disconnect_Sound}

#-------------------------------------------
# Display qspi
#-------------------------------------------
spi:
  id: display_qspi
  type: quad
  clk_pin: 47
  data_pins: [21, 48, 40, 39]

display:
  - platform: mipi_spi
    model: JC3248W535
#  - platform: qspi_dbi
#    model: axs15231
    data_rate: 40MHz
    id: my_display
    spi_id: display_qspi
    dimensions:
      height: 480
      width: 320
    cs_pin:
      number: 45
      ignore_strapping_warning: true
    rotation: 90  # 90 for landscape, 270 for landscape inverted
    auto_clear_enabled: false  # has to be set to 'false' for lvgl

#-------------------------------------------
# Touchscreen gt911 i2c
#-------------------------------------------
i2c:
  sda: 4
  scl: 8
  id: touchscreen_bus
# scan: true

touchscreen:
  - platform: axs15231
    id: my_touch
    display: my_display
    i2c_id: touchscreen_bus
    calibration:
      x_min: 1
      x_max: 480
      y_min: 1
      y_max: 320
    transform:
      swap_xy: true
# for 90° normal display orientation
      mirror_x: false
      mirror_y: true
# for 270° inverted display orientation
#      mirror_x: true
#      mirror_y: false
# for test purposes, touch coordinates can be logged
#    on_touch:
#      - lambda: |-
#          ESP_LOGI("cal", "x=%d, y=%d, x_raw=%d, y_raw=%0d",
#            touch.x,
#            touch.y,
#            touch.x_raw,
#            touch.y_raw
#          );
    on_release:
      - if:
          condition: lvgl.is_paused
          then:
            - logger.log: "Display is resuming"
            # commented: stay where you are
            # - script.execute: show_temperatures_page
            - lvgl.resume:
            - lvgl.widget.redraw:
            - light.turn_on: backlight

#-------------------------------------------
# Internal outputs
#-------------------------------------------
output:
  - id: gpio_backlight_pwm
    platform: ledc
    pin: 1

  # either a simple beeper
  - id: helper_low_beeper
    platform: ledc
    pin: 14
  - platform: ledc
    pin: 9
    id: rtttl_out

  # or a beeper with a transisitor for amplification
  # But in my experience it is north the effort. Similar (low) volume.
  # - platform: ledc
  #   pin: 17
  #   id: rtttl_out

#-------------------------------------------
# Internal lights
#-------------------------------------------
light:
  - id: backlight
    name: Backlight
    platform: monochromatic
    output: gpio_backlight_pwm
    restore_mode: ALWAYS_ON

#-------------------------------------------
# Internal RTTTL speaker
#-------------------------------------------
rtttl:
  id: my_rtttl
  output: rtttl_out
  gain: ${Beeper_Max}

interval:
  - interval: 1s
    then:
      - script.execute: timer_update
  - interval: 10s
    then:
      - lvgl.widget.refresh: warning_on_label
  - interval: ${Beeper_interval}
    then:
      - lambda: |-
          if( ((id(zone1_limit_value) > 0) && (id(zone1_value) >= id(zone1_limit_value)))
           || ((id(zone2_limit_value) > 0) && (id(zone2_value) >= id(zone2_limit_value)))
           || ((id(zone3_limit_value) > 0) && (id(zone3_value) >= id(zone3_limit_value)))
           || ((id(zone4_limit_value) > 0) && (id(zone4_value) >= id(zone4_limit_value))) ) {
            id(my_rtttl).play("${Zone_Limit_Alarm_Sound}");
          }
          else if ( ((id(sensor1_limit_value) > 0) && (id(sensor1_value) >= id(sensor1_limit_value)))
                 || ((id(sensor2_limit_value) > 0) && (id(sensor2_value) >= id(sensor2_limit_value)))
                 || ((id(sensor3_limit_value) > 0) && (id(sensor3_value) >= id(sensor3_limit_value)))
                 || ((id(sensor4_limit_value) > 0) && (id(sensor4_value) >= id(sensor4_limit_value))) ) {
            id(my_rtttl).play("${Sensor_Limit_Alarm_Sound}");
          }
          else if( id(timer_alarm) == true ) {
            id(my_rtttl).play("${Timer_Alarm_Sound}");
          }
  - interval: 1s
    then:
      - if:
          condition:
            and:
              - lambda: return !id(boot_screen_color_scheme_init);
          then:
            - lambda: |-
                id(boot_screen_color_scheme_init) = true;
                id(settings_color_scheme_idx) = id(settings_color_scheme_idx_persistent);
                id(apply_color_scheme).execute();

      - if:
          condition:
            and:
              - lambda: 'return !id(boot_screen_hidden);'
              - lambda: 'return millis() - id(boot_start_time) >= 2000;'
          then:
            - script.execute: hide_boot_screen

#-------------------------------------------
# Global varaibles
#-------------------------------------------
globals:
  - id: wifi_connected
    type: bool
    initial_value: 'false'
  - id: g32_connected
    type: bool
    initial_value: 'false'
  - id: firebox_open
    type: bool
    initial_value: 'false'
  - id: light_on
    type: bool
    initial_value: 'false'
  - id: warning_on
    type: bool
    initial_value: 'false'
  - id: gas_weight
    type: int32_t
    initial_value: '-1'
  - id: gas_percent
    type: int32_t
    initial_value: '0'
  - id: ble_g32_scan_started_by_user  # for managing "scan" button status
    type: bool
    initial_value: 'false'
