          - lvgl.widget.refresh: settings_mac_address_label
          - lvgl.widget.hide: settings_mac_address_updated
          - lvgl.widget.refresh: [settings_meater0_label, settings_meater1_label, settings_meater2_label, settings_meater3_label]
          - lvgl.widget.hide: [settings_meater0_updated, settings_meater1_updated, settings_meater2_updated, settings_meater3_updated]
