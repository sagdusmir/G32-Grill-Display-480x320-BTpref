                    lv_roller_set_selected(id(sensor_limits_ones_roller)->obj, 0, LV_ANIM_ON);
        - button:
            id: sensor_limits_button_okay
            x: 398
            y: 160
            width: 70
            height: 100
            bg_color: !lambda return lv_color_hex(id(color_50));
            shadow_color: !lambda return lv_color_hex(id(color_25));
